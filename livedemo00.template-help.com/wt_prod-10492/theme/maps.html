<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroNexis Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles_maps.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">HN</div>
      <div>
        <strong>HydroNexis Maps</strong>
        <span>Marketplace local</span>
      </div>
    </div>
    <div class="topbar-actions"><a class="topbar-link" href="registrar_maps.html">Registrar vendedor</a><span id="connectionBadge" class="connection-badge">Iniciando…</span></div>
  </header>

  <main class="map-layout">
    <aside class="sidebar">
      <section class="sidebar-intro">
        <span class="eyebrow">Marketplace local</span>
        <h1>Encuentra productos cerca de ti</h1>
        <p>Busca por negocio, vendedor, producto, distrito o corregimiento.</p>
      </section>

      <div class="search-box">
        <label for="searchInput">Buscar lugares</label>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="Ej. lechuga, La Chorrera…" autocomplete="off">
          <button id="searchButton" class="icon-button" type="button" aria-label="Buscar">⌕</button>
        </div>
      </div>

      <div class="filter-grid">
        <label>Producto
          <select id="productFilter"><option value="">Todos</option></select>
        </label>
        <label>Distrito
          <select id="districtFilter"><option value="">Todos</option></select>
        </label>
      </div>

      <div class="sidebar-buttons">
        <button id="nearMeButton" class="button button-dark" type="button">Usar mi ubicación</button>
        <button id="resetButton" class="button button-mint" type="button">Limpiar</button>
      </div>

      <div class="results-heading">
        <h2>Resultados</h2>
        <span id="resultsCounter">0</span>
      </div>
      <div id="placesList" class="places-list" aria-live="polite"></div>
    </aside>

    <section class="map-panel">
      <div id="map" aria-label="Mapa interactivo de ubicaciones"></div>
      <div id="mapMessage" class="map-message hidden"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/map.js"></script>
</body>
</html>
