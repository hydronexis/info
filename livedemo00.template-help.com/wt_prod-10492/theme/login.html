<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>
    <link rel="icon" href="images/future-ico.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="http://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700%7CLato%7CKalam:300,400,700">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="auth-page">
  <div class="auth-shell">
    <section class="auth-visual">
      <span class="eyebrow">Secure access</span>
      <h2>Welcome to your workspace</h2>
      <p>Sign in to continue or create an account to unlock your personalized dashboard and plan-based experience.</p>
    </section>

    <div class="auth-card">
      <div class="logo">
        <img src="images/logo20.png" alt="Logo">
      </div>

      <h1 class="title" id="title">Sign In</h1>

      <p class="subtitle" id="subtitle">
        Welcome Back
      </p>

      <form id="signin" class="active" onsubmit="handleSignIn(event)">
        <div class="message" id="signinMessage"></div>

        <div class="input-box">
          <input type="email" id="signinEmail" placeholder="Email Address" required>
        </div>

        <div class="input-box">
          <input type="password" id="signinPassword" placeholder="Password" required>
        </div>

        <button type="submit" class="main-btn">Sign In</button>

        <div class="separator">OR</div>

        <button type="button" class="main-btn" style="margin-bottom: 10px; background: linear-gradient(135deg, #ffffff, #f7f3eb); color: var(--primary); box-shadow: none; border: 1px solid var(--border);">Continue with Google</button>
        <button type="button" class="main-btn" style="background: linear-gradient(135deg, #ffffff, #f7f3eb); color: var(--primary); box-shadow: none; border: 1px solid var(--border);">Continue with Apple</button>
      </form>

      <form id="signup" onsubmit="handleSignUp(event)">
        <div class="message" id="signupMessage"></div>

        <div class="input-box">
          <input type="text" id="signupName" placeholder="Full Name" required>
        </div>

        <div class="input-box">
          <input type="email" id="signupEmail" placeholder="Email Address" required>
        </div>

        <div class="input-box">
          <input type="password" id="signupPassword" placeholder="Password" required>
        </div>

        <div class="input-box">
          <input type="password" id="signupConfirm" placeholder="Confirm Password" required>
        </div>

        <div class="input-box">
          <select id="signupPlan" required>
            <option value="">Select a plan</option>
            <option value="plan1">Plan 1</option>
            <option value="plan2">Plan 2</option>
            <option value="plan3">Plan 3</option>
          </select>
        </div>

        <button type="submit" class="main-btn">Create Account</button>
      </form>

      <div class="toggle">
        <span id="toggleText">Don't have an account?</span>
        <button type="button" onclick="changeForm()" id="toggleButton">Sign Up</button>
      </div>
    </div>
  </div>

  <script>
    let login = true;

    function changeForm() {
      const signin = document.getElementById("signin");
      const signup = document.getElementById("signup");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const text = document.getElementById("toggleText");
      const button = document.getElementById("toggleButton");
      const signinMessage = document.getElementById("signinMessage");
      const signupMessage = document.getElementById("signupMessage");

      signinMessage.className = "message";
      signupMessage.className = "message";
      signinMessage.textContent = "";
      signupMessage.textContent = "";

      if (login) {
        signin.classList.remove("active");
        signup.classList.add("active");
        title.innerHTML = "Sign Up";
        subtitle.innerHTML = "Create your account";
        text.innerHTML = "Already have an account? ";
        button.innerHTML = "Sign In";
      } else {
        signup.classList.remove("active");
        signin.classList.add("active");
        title.innerHTML = "Sign In";
        subtitle.innerHTML = "Welcome Back";
        text.innerHTML = "Don't have an account? ";
        button.innerHTML = "Sign Up";
      }

      login = !login;
    }

    function handleSignIn(event) {
      event.preventDefault();
      const email = document.getElementById("signinEmail").value.trim();
      const password = document.getElementById("signinPassword").value.trim();
      const message = document.getElementById("signinMessage");

      if (!email || !password) {
        message.className = "message error";
        message.textContent = "Please complete both fields to continue.";
        return;
      }

      message.className = "message success";
      message.textContent = "Login successful. Redirecting to your dashboard...";
      const plan = localStorage.getItem("selectedPlan") || "plan1";
      setTimeout(() => {
        window.location.href = `dashboard.html?username=${encodeURIComponent(email.split('@')[0])}&plan=${plan}`;
      }, 700);
    }

    function handleSignUp(event) {
      event.preventDefault();
      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value.trim();
      const confirm = document.getElementById("signupConfirm").value.trim();
      const plan = document.getElementById("signupPlan").value;
      const message = document.getElementById("signupMessage");

      if (!name || !email || !password || !confirm || !plan) {
        message.className = "message error";
        message.textContent = "Please complete every field before creating your account.";
        return;
      }

      if (password !== confirm) {
        message.className = "message error";
        message.textContent = "Passwords do not match.";
        return;
      }

      localStorage.setItem("selectedPlan", plan);
      message.className = "message success";
      message.textContent = "Account created successfully. Redirecting to your dashboard...";
      setTimeout(() => {
        window.location.href = `dashboard.html?username=${encodeURIComponent(name)}&plan=${plan}`;
      }, 700);
    }
  </script>
</body>
</html>
